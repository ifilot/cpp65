MEMORY {
    ROM:     start = $8000, size = $7FFA, file = %O, fill = yes;
    VECTORS: start = $FFFA, size = $0006, file = %O, fill = yes;
}

SEGMENTS {
    CODE:    load = ROM,     type = ro;
    VECTORS: load = VECTORS, type = ro;
}
